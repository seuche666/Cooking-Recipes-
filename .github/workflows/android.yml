name: Android-App bauen

# Bei jedem Merge auf main: APK bauen, signieren und als GitHub-Release bereitstellen.
# Bei Pull Requests: nur bauen und testen (die APK gibt es dann als Download unter "Artifacts").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Signierschlüssel aus den Repository-Secrets (siehe README):
      #   SIGNING_KEYSTORE_BASE64  – Keystore-Datei als Base64-Text
      #   SIGNING_PASSWORD         – Passwort des Keystores und des Schlüssels
      #   SIGNING_KEY_ALIAS        – optional; ohne Angabe wird der erste Alias im Keystore verwendet
      # Ohne Secrets: Bei Pull Requests wird nur unsigniert gebaut,
      # auf main bricht der Build ab (es wird nie eine unsignierte App veröffentlicht).
      - name: Signierschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            LEVEL=error; [ "$IS_RELEASE" = "true" ] || LEVEL=warning
            if ! KEY_ALIAS=$(LEVEL=$LEVEL .github/scripts/check-keystore.sh "$RUNNER_TEMP/release.jks"); then
              if [ "$IS_RELEASE" = "true" ]; then
                exit 1
              fi
              # Pull Requests: trotzdem eine unsignierte Test-APK bauen
              echo "SIGNED=false" >> "$GITHUB_ENV"
              echo "::warning::Signierschlüssel unbrauchbar (siehe Hinweis oben) – es wird nur eine unsignierte Test-APK gebaut."
              exit 0
            fi
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "SIGNING_PASSWORD=$SIGNING_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signierschlüssel aus den Secrets wird verwendet (Alias: $KEY_ALIAS)."
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Die Secrets SIGNING_KEYSTORE_BASE64 und SIGNING_PASSWORD fehlen. Ohne sie wird kein Release erstellt (siehe README)."
            exit 1
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Keine Signier-Secrets verfügbar – es wird nur eine unsignierte Test-APK gebaut."
          fi

      - name: Tests ausführen
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK umbenennen
        run: |
          mkdir -p out
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/Rezeptbuch-$VERSION_NAME.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/Rezeptbuch-$VERSION_NAME-unsigniert.apk"
          fi

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v5
        with:
          name: Rezeptbuch-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: GitHub-Release erstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "out/Rezeptbuch-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Rezeptbuch $VERSION_NAME" \
            --notes "Neue Version der Rezeptbuch-App.

          **Installieren:** Unten bei *Assets* auf **Rezeptbuch-$VERSION_NAME.apk** tippen, herunterladen und öffnen.
          Ein Update wird einfach über die alte Version installiert – deine Rezepte bleiben erhalten." \
            --latest
