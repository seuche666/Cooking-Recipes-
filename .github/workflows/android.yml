name: Android-App bauen

# Bei jedem Merge auf main: APK bauen, signieren und als GitHub-Release bereitstellen.
# Bei Pull Requests: nur bauen und testen (die APK gibt es dann als Download unter "Artifacts").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Signierung: Es wird nur EIN Secret gebraucht, SIGNING_PASSWORD (mindestens 16 zufällige Zeichen).
      # Daraus wird bei jedem Lauf derselbe Schlüssel abgeleitet (.github/scripts/derive-keystore.py),
      # es muss also kein Keystore als Text kopiert werden. Siehe README.
      # Ohne Secret: Bei Pull Requests wird nur unsigniert gebaut,
      # auf main bricht der Build ab (es wird nie eine unsignierte App veröffentlicht).
      - name: Signierschlüssel einrichten
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            python3 -m venv "$RUNNER_TEMP/signing-venv"
            # Version fest: Sie bestimmt die exakten Zertifikats-Bytes und damit die Update-Fähigkeit.
            "$RUNNER_TEMP/signing-venv/bin/pip" install --quiet "cryptography==50.0.2"
            if ! FINGERPRINT=$("$RUNNER_TEMP/signing-venv/bin/python" .github/scripts/derive-keystore.py "$RUNNER_TEMP/release.p12"); then
              if [ "$IS_RELEASE" = "true" ]; then exit 1; fi
              echo "SIGNED=false" >> "$GITHUB_ENV"
              echo "::warning::Signierschlüssel konnte nicht erzeugt werden – es wird nur eine unsignierte Test-APK gebaut."
              exit 0
            fi
            {
              echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
              echo "SIGNING_PASSWORD=$SIGNING_PASSWORD"
              echo "SIGNING_KEY_ALIAS=rezeptbuch"
              echo "SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "Signiert wird mit dem Zertifikat SHA-256 $FINGERPRINT"
            echo "**Signatur-Zertifikat (SHA-256):** \`$FINGERPRINT\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::Das Secret SIGNING_PASSWORD fehlt. Ohne es wird kein Release erstellt (siehe README)."
            exit 1
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Kein Secret SIGNING_PASSWORD verfügbar – es wird nur eine unsignierte Test-APK gebaut."
          fi

      - name: Tests ausführen
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK umbenennen
        run: |
          mkdir -p out
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/Rezeptbuch-$VERSION_NAME.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/Rezeptbuch-$VERSION_NAME-unsigniert.apk"
          fi

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v5
        with:
          name: Rezeptbuch-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: GitHub-Release erstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "out/Rezeptbuch-$VERSION_NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Rezeptbuch $VERSION_NAME" \
            --notes "Neue Version der Rezeptbuch-App.

          **Installieren:** Unten bei *Assets* auf **Rezeptbuch-$VERSION_NAME.apk** tippen, herunterladen und öffnen.
          Ein Update wird einfach über die alte Version installiert – deine Rezepte bleiben erhalten." \
            --latest
